name: weekly-report

on:
  schedule:
    # Saturday 9am America/Chicago (CDT, UTC-5) — roughly mid-March to early November.
    # Swap to '0 15 * * 6' for CST (UTC-6) roughly early November to mid-March.
    # See README.md "Schedule and the DST caveat" for details.
    - cron: "0 14 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python agent.py

      - name: Commit updated memory and reports
        run: |
          git config user.name "research-agent-bot"
          git config user.email "actions@github.com"
          git add frontier_memory.json trends_memory.json reports/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly update: $(date -u +'%Y-%m-%d')"
            git push
          fi
